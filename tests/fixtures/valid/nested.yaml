version: "1.0"
name: "SBI Cosmological Parameter Estimation"
description: |
  Use simulation-based inference to constrain cosmological
  parameters from Type Ia supernova survey data.

inputs:
  - id: survey_catalog
    type: data
    source: "sn_survey_union2.1"
    description: "Observed Type Ia supernova catalog"

outputs:
  - id: posterior_contours
    type: figure
  - id: parameter_constraints
    type: table

decisions:
  cosmology_model:
    label: "Cosmological Model"
    type: method
    default: flat_lcdm
    options:
      flat_lcdm:
        label: "Flat LCDM"
      wcdm:
        label: "wCDM"

analyses:
  build_mocks:
    description: "Generate realistic mock catalogs matching survey properties."
    parent_decisions: [cosmology_model]
    success_criteria:
      - "Mock catalog matches observed magnitude distribution"
    inputs:
      - id: survey_data
        type: data
        from: survey_catalog
    outputs:
      - id: mock_catalog
        type: data
      - id: mock_sample_plot
        type: figure
        description: "Sample mock catalog visualization"
    decisions:
      noise_model:
        label: "Noise Model"
        type: method
        default: heteroscedastic
        options:
          homoscedastic:
            label: "Homoscedastic"
            incompatible_with:
              - cosmology_model.wcdm
          heteroscedastic:
            label: "Heteroscedastic"
    recipes:
      generate:
        command: python src/generate_mocks.py
        outputs: [mock_catalog, mock_sample_plot]

  train_network:
    description: "Train SBI neural network on mock catalog."
    inputs:
      - id: training_data
        type: data
        from: build_mocks.mock_catalog
    outputs:
      - id: trained_model
        type: data
    decisions:
      architecture:
        label: "Network Architecture"
        type: method
        default: maf
        options:
          maf:
            label: "Masked Autoregressive Flow"
          npe:
            label: "Neural Posterior Estimation"
    recipes:
      train:
        command: python src/train.py
        outputs: [trained_model]
        resources:
          gpus: 1
          memory: "32GB"

  validate:
    description: "Validate trained model against observed data."
    inputs:
      - id: model
        type: data
        from: train_network.trained_model
      - id: observed
        type: data
        from: survey_catalog
    outputs:
      - id: validation_report
        type: report
