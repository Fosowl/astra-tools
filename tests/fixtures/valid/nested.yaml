version: "1.0"

analysis:
  name: "SBI Cosmological Parameter Estimation"
  problem: |
    Use simulation-based inference to constrain cosmological
    parameters from Type Ia supernova survey data.

  inputs:
    - id: survey_catalog
      type: data
      source: "sn_survey_union2.1"
      description: "Observed Type Ia supernova catalog"

  outputs:
    - id: posterior_contours
      type: figure
      formats: [png]
      path: posterior_contours.png
    - id: parameter_constraints
      type: table
      formats: [csv]
      path: parameter_constraints.csv

  analyses:
    build_mocks:
      problem: "Generate realistic mock catalogs matching survey properties."
      success_criteria:
        - "Mock catalog matches observed magnitude distribution"
      inputs:
        - id: survey_data
          type: data
          from: survey_catalog
      outputs:
        - id: mock_catalog
          type: data
        - id: mock_sample_plot
          type: figure
          path: mock_sample_plot.png
          description: "Sample mock catalog visualization"
      decisions:
        noise_model:
          label: "Noise Model"
          type: method
          default: heteroscedastic
          options:
            homoscedastic:
              label: "Homoscedastic"
            heteroscedastic:
              label: "Heteroscedastic"

    train_network:
      problem: "Train SBI neural network on mock catalog."
      inputs:
        - id: training_data
          type: data
          from: build_mocks.mock_catalog
      outputs:
        - id: trained_model
          type: model
      decisions:
        architecture:
          label: "Network Architecture"
          type: method
          default: maf
          options:
            maf:
              label: "Masked Autoregressive Flow"
            npe:
              label: "Neural Posterior Estimation"

    validate:
      problem: "Validate trained model against observed data."
