version: "1.0"

analysis:
  name: "Cycle Test"
  problem: "Test cycle detection in sub-analysis wiring"

  inputs:
    - id: data
      type: data

  outputs:
    - id: result
      type: metric
      dtype: float

sub_analyses:
  step_a:
    path: ./sub/step_a
    inputs:
      data: step_b.output

  step_b:
    path: ./sub/step_b
    inputs:
      data: step_a.output
