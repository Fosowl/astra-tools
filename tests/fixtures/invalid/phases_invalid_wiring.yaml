version: "1.0"

analysis:
  name: "Bad Wiring Test"
  problem: "Test invalid phase wiring"

  inputs:
    - id: data
      type: data

  outputs:
    - id: result
      type: metric
      dtype: float

phases:
  step_a:
    problem: "Step A"
    inputs:
      - id: data
        from: inputs.nonexistent_input
    outputs:
      - id: output
        type: data

  step_b:
    problem: "Step B"
    inputs:
      - id: data
        from: nonexistent_phase.output
    outputs:
      - id: output
        type: data
