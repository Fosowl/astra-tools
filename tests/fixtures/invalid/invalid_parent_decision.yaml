version: "1.0"
name: "Test invalid parent_decisions"
description: "Sub-analysis references non-existent parent decision"
inputs:
  - id: data
    type: data
outputs:
  - id: result
    type: metric

analyses:
  sub:
    parent_decisions: [nonexistent_decision]
    inputs:
      - id: sub_data
        type: data
        from: data
    outputs:
      - id: sub_result
        type: metric
