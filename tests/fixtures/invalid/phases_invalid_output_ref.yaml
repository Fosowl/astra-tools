version: "1.0"

analysis:
  name: "Bad Output Ref Test"
  problem: "Test phase 'from' referencing valid phase but nonexistent output"

  inputs:
    - id: data
      type: data

  outputs:
    - id: result
      type: figure
      formats: [png]
      from: step_a.nonexistent_output

phases:
  step_a:
    problem: "Step A"
    inputs:
      - id: data
        from: inputs.data
    outputs:
      - id: output
        type: data
