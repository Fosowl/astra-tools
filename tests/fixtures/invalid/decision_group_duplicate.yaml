# Decision appears in two groups
version: "1.0"
name: "Test"
inputs:
  - id: data
    type: data
outputs:
  - id: result
    type: metric
decisions:
  method:
    label: "Method"
    type: method
    options:
      a:
        label: "A"
  seed:
    label: "Seed"
    type: parameter
    options:
      s1:
        label: "1"
decision_groups:
  - label: "Group 1"
    decisions:
      - method
      - seed
  - label: "Group 2"
    decisions:
      - method
