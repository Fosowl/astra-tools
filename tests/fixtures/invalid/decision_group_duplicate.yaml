# Same decision in two groups
version: "1.0"
name: "Test"
inputs:
  - id: data
    type: data
outputs:
  - id: result
    type: metric
decision_groups:
  - label: "Group 1"
    decisions:
      method:
        label: "Method"
        default: a
        options:
          a:
            label: "A"
          b:
            label: "B"
  - label: "Group 2"
    decisions:
      method:
        label: "Method copy"
        default: x
        options:
          x:
            label: "X"
